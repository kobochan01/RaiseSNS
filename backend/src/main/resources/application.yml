spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:raisesns}
    username: ${POSTGRES_USER:raisesns}
    password: ${POSTGRES_PASSWORD:raisesns}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-please-override-32bytes-min-xxxxxxxx}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cookie:
    access-token-name: ACCESS_TOKEN
    refresh-token-name: REFRESH_TOKEN
    secure: ${COOKIE_SECURE:false}
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-1}
